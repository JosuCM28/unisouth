# Alternativa a la configuración por UI de Dokploy.
#
# Si prefieres apuntar Dokploy a un Compose en vez de a un Dockerfile suelto,
# usa este archivo. La base de datos NO va aquí: es el PostgreSQL que ya corre
# en el VPS, con su propio ciclo de vida. Meterla en este compose la ataría al
# despliegue de la app, y un `docker compose down` distraído se llevaría el
# inventario entero.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Se hornea en el bundle del cliente: es la base del QR de cada rollo.
        # Tiene que ser la URL pública real, no localhost.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      DATABASE_URL: ${DATABASE_URL}
      # La que usan las MIGRACIONES, que corren al arrancar el contenedor.
      # Hoy es la misma cadena: el Postgres del VPS se conecta directo. Existe
      # aparte porque un pooler (PgBouncer y compañía) no soporta migraciones,
      # así que el día que se meta uno, aquí va la cadena que lo esquiva.
      DIRECT_URL: ${DIRECT_URL}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

      # Dónde se guardan las fotos de las órdenes. Es la ruta DENTRO del
      # contenedor, la misma que monta el volumen de abajo.
      UPLOADS_DIR: /app/uploads

    # Las fotos de las órdenes son el respaldo de los papeles que llegan a la
    # fábrica: viven fuera del contenedor o se van con el siguiente despliegue.
    #
    # Volumen CON NOMBRE y no una carpeta del host: al montarse sobre una ruta
    # que ya existe en la imagen hereda su dueño —`nextjs`, que es quien corre
    # la app— y nace escribible sin tener que entrar por SSH a dar permisos.
    volumes:
      - uploads:/app/uploads

    # Dokploy publica el puerto por su propio proxy (Traefik), así que no se
    # expone al host: dejarlo abierto sería saltarse el TLS del proxy.
    expose:
      - "3000"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  uploads:
